name: Actualizar calendario de wipes

on:
  schedule:
    - cron: "7 * * * *"   # cada hora (minuto 7 para evitar la hora punta)
  workflow_dispatch:

concurrency:
  group: wipe-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # El bot puede quedarse reeditando hasta ~65 min si un wipe esta cerca
    # (ver MAX_LOOP_SECONDS en src/wipe_bot/main.py); dejamos margen.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Editar mensaje en Discord y limpiar el canal
        env:
          PYTHONPATH: src
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MESSAGE_ID: ${{ vars.MESSAGE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
        run: python -m wipe_bot
