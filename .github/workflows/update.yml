name: Actualizar calendario de wipes

on:
  schedule:
    - cron: "7 * * * *"   # cada hora (minuto 7 para evitar la hora punta)
  workflow_dispatch:

concurrency:
  group: wipe-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Editar mensaje en Discord
        env:
          PYTHONPATH: src
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MESSAGE_ID: ${{ vars.MESSAGE_ID }}
        run: python -m wipe_bot
